name: MKR SEO Audit

# Read-only crawl of the live site. Saves pages and issues to Neon so the
# admin SEO tab can show them. Never changes the website.
#
# Needs one repository secret: DATABASE_URL (the same Neon connection string
# the site uses). Without it the audit still runs and the report is kept as a
# downloadable artifact, but nothing reaches the dashboard.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      job_id:
        description: 'seo_jobs id queued from the dashboard (leave empty for a fresh run)'
        required: false
        default: ''

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          ARGS="--out seo-audit.json"
          if [ -n "$DATABASE_URL" ]; then ARGS="$ARGS --db"; fi
          if [ -n "$JOB_ID" ]; then ARGS="$ARGS --job $JOB_ID"; fi
          node scripts/seo-audit.mjs $ARGS
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: seo-audit.json
          if-no-files-found: ignore
          retention-days: 30
