name: MKR IndexNow Ping

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect changed pages
        id: changed
        run: |
          {
            echo 'files<<EOF'
            git diff --name-only HEAD^ HEAD 2>/dev/null | grep '\.html$' || true
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Wait for the deploy to carry the changes
        run: sleep 90
      - name: Ping IndexNow
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: node scripts/indexnow.mjs
