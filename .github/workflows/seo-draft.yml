name: MKR SEO Draft

# Writes one AI draft into the approval queue. It never approves or publishes.
# Started from the admin SEO page ("Draft this") or by hand.
#
# Repository secrets needed: DATABASE_URL, ANTHROPIC_API_KEY
# Optional repository variable: SEO_MODEL (defaults to claude-sonnet-5-5)

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'seo_jobs id created by the dashboard (leave empty when redrafting the queue)'
        required: false
        default: ''
      queued:
        description: 'Redraft every imported queue post that is still its original short text'
        type: boolean
        required: false
        default: false
      posts:
        description: 'Redraft every imported LIVE post that is still its original short text'
        type: boolean
        required: false
        default: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Write the draft
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEO_MODEL: ${{ vars.SEO_MODEL }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          QUEUED: ${{ github.event.inputs.queued }}
          POSTS: ${{ github.event.inputs.posts }}
        run: |
          if [ "$POSTS" = "true" ]; then node scripts/seo-draft.mjs --posts
          elif [ "$QUEUED" = "true" ]; then node scripts/seo-draft.mjs --queued
          else node scripts/seo-draft.mjs --job "$JOB_ID"; fi
