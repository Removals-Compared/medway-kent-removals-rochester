name: MKR SEO Migrate

# Applies the idempotent SEO database files in admin/SEO-SCHEMA-*.sql
# (new tables only; safe to run any number of times). Needs DATABASE_URL.

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Apply schema files
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/seo-migrate.mjs
