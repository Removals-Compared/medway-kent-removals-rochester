name: Publish Scheduled Blog Posts

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Publishes due posts, keeps the writing clean (no em dashes),
      # and keeps blog.html + sitemap.xml in sync with blog/posts/.
      - name: Publish due posts and sync index + sitemap
        run: node scripts/publish-due.mjs

      - name: Commit and push if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "MKR Blog Bot"
            git config user.email "info@medwaykentremovals.co.uk"
            git add blog/posts blog/scheduled blog.html sitemap.xml
            git commit -m "Auto-publish blog post(s) for $(date +%Y-%m-%d) and sync index/sitemap"
            git push
          else
            echo "Nothing to publish today"
          fi
