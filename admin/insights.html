<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="/images/admin-touch-icon.png">
<link rel="manifest" href="/admin/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="MKR Admin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D1F3C">
<meta name="robots" content="noindex, nofollow">
<title>Insights — Admin — Medway &amp; Kent Removals</title>
<style>
  :root{
    --navy:#0d1f3c; --orange:#e04e1b; --bg:#f4f5f7; --line:#e3e6ec;
    --ink:#1a2233; --ink2:#556; --ink3:#889;
    --good:#15803d; --bad:#b91c1c;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--ink); }
  .topbar{ background:var(--navy); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:14px; }
  .topbar .brand{ font-weight:700; }
  .topbar .crumb{ color:#ff9a75; font-size:14px; }
  .topbar .spacer{ flex:1; }
  .topbar a{ color:#cfd6e4; text-decoration:none; font-size:14px; }
  .wrap{ max-width:1180px; margin:0 auto; padding:24px; }
  .muted{ color:var(--ink3); font-size:13px; }

  /* KPI tiles */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:20px; }
  .kpi{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .kpi .l{ font-size:12px; color:var(--ink2); text-transform:uppercase; letter-spacing:.4px; }
  .kpi .n{ font-size:27px; font-weight:800; color:var(--navy); margin-top:4px; font-variant-numeric:tabular-nums; }
  .kpi .s{ font-size:12.5px; color:var(--ink3); margin-top:3px; }
  .kpi .s .up{ color:var(--good); font-weight:700; }
  .kpi .s .down{ color:var(--bad); font-weight:700; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media(max-width:860px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-bottom:16px; }
  .card h2{ margin:0 0 4px; font-size:15px; color:var(--navy); }
  .card .sub{ font-size:12.5px; color:var(--ink3); margin:0 0 14px; }

  /* bar chart (single series, CSS columns) */
  .chart{ display:flex; align-items:flex-end; gap:8px; height:150px; padding-top:18px; }
  .chart .col{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; min-width:0; }
  .chart .bar{ width:100%; max-width:46px; background:var(--navy); border-radius:4px 4px 0 0; min-height:2px; position:relative; transition:opacity .12s; }
  .chart .bar.accent{ background:var(--orange); }
  .chart .col:hover .bar{ opacity:.75; }
  .chart .val{ font-size:11.5px; font-weight:700; color:var(--ink2); margin-bottom:4px; font-variant-numeric:tabular-nums; visibility:hidden; }
  .chart .col:hover .val, .chart .col .val.show{ visibility:visible; }
  .chart .lab{ font-size:11.5px; color:var(--ink3); margin-top:6px; white-space:nowrap; }

  /* status rows */
  .srow{ display:grid; grid-template-columns:110px 1fr 70px; gap:10px; align-items:center; margin-bottom:9px; font-size:13.5px; }
  .srow .pill{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700; text-align:center; }
  .srow .track{ background:#f1f2f5; border-radius:4px; height:14px; overflow:hidden; }
  .srow .fill{ height:100%; border-radius:4px 0 0 4px; min-width:2px; }
  .srow .cnt{ text-align:right; color:var(--ink2); font-variant-numeric:tabular-nums; }
  .srow .cnt strong{ color:var(--navy); }
  .pill.new{ background:#e8f0ff; color:#1d4ed8; }
  .pill.contacted{ background:#fff4e0; color:#b45309; }
  .pill.quote_sent{ background:#e0e7ff; color:#4338ca; }
  .pill.prospecting{ background:#ccfbf1; color:#0f766e; }
  .pill.survey_booked{ background:#ede9fe; color:#6d28d9; }
  .pill.move_booked{ background:#dcfce7; color:#15803d; }
  .pill.won{ background:#16a34a; color:#fff; }
  .pill.lost{ background:#fee2e2; color:#b91c1c; }

  /* lists */
  .list{ margin:0; padding:0; list-style:none; }
  .list li{ display:flex; align-items:center; gap:12px; padding:10px 2px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .list li:last-child{ border-bottom:none; }
  .list .when{ min-width:86px; font-weight:700; color:var(--navy); font-variant-numeric:tabular-nums; }
  .list .who{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list .who a{ color:var(--ink); text-decoration:none; font-weight:600; }
  .list .who a:hover{ color:var(--orange); }
  .list .who .sub{ display:block; color:var(--ink3); font-size:12px; font-weight:400; }
  .list .amt{ font-weight:700; color:var(--navy); font-variant-numeric:tabular-nums; }
  .list .days{ font-size:12px; color:var(--ink3); white-space:nowrap; }
  .list .days.overdue{ color:var(--bad); font-weight:700; }
  .empty{ color:var(--ink3); font-size:13px; padding:14px 0; }

  @media(max-width:640px){
    .wrap{ padding:14px 12px; }
    .topbar{ padding:12px 14px; }
    .kpi .n{ font-size:22px; }
    .chart{ height:120px; }
    .srow{ grid-template-columns:96px 1fr 56px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">Medway &amp; Kent Removals</span>
    <span class="crumb">Admin / Insights</span>
    <span class="spacer"></span>
    <a href="/admin/dashboard">&larr; Leads</a>
  </div>

  <div class="wrap">
    <div id="content"><p class="muted">Loading…</p></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const money = (n) => '£' + Math.round(Number(n) || 0).toLocaleString('en-GB');
  const labelFor = (s) => ({ new:'New', contacted:'Contacted', quote_sent:'Quote Sent', prospecting:'Prospecting', survey_booked:'Survey booked', move_booked:'Move booked', won:'Completed', lost:'Lost' }[s] || s || 'New');
  const FILLS = { new:'#1d4ed8', contacted:'#b45309', quote_sent:'#4338ca', prospecting:'#0f766e', survey_booked:'#6d28d9', move_booked:'#15803d', won:'#16a34a', lost:'#b91c1c' };
  const ORDER = ['new','move_booked','survey_booked','prospecting','quote_sent','contacted','won','lost'];

  const val = (r) => { const v = Number(r.value); return isFinite(v) ? v : 0; };
  const st  = (r) => r.status || 'new';
  function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
  function fmtDay(d){ return d.toLocaleDateString('en-GB', { day:'numeric', month:'short' }); }

  async function load(){
    let r;
    try { r = await fetch('/api/admin/quotes'); }
    catch(e){ $('content').innerHTML = '<p class="muted">Could not load data.</p>'; return; }
    if (r.status === 401){ window.location.href = '/admin'; return; }
    if (!r.ok){ $('content').innerHTML = '<p class="muted">Could not load data.</p>'; return; }
    const rows = (await r.json()).quotes || [];
    render(rows);
  }

  function render(rows){
    const now = new Date();
    const todayKey = now.toISOString().slice(0,10);
    const thisMonth = monthKey(now);
    const lastMonth = monthKey(new Date(now.getFullYear(), now.getMonth()-1, 1));

    // ── KPIs ──
    const PIPELINE = ['new','contacted','quote_sent','prospecting','survey_booked'];
    const pipelineVal = rows.filter(r => PIPELINE.includes(st(r))).reduce((a,r) => a+val(r), 0);
    const pipelineN   = rows.filter(r => PIPELINE.includes(st(r))).length;
    const booked   = rows.filter(r => st(r) === 'move_booked');
    const bookedVal = booked.reduce((a,r) => a+val(r), 0);
    const wonRows  = rows.filter(r => st(r) === 'won');
    const wonVal   = wonRows.reduce((a,r) => a+val(r), 0);
    const wonThisMonth = wonRows.filter(r => (r.move_date || r.created_at || '').slice(0,7) === thisMonth).reduce((a,r) => a+val(r), 0);
    const lostN    = rows.filter(r => st(r) === 'lost').length;
    const winRate  = (wonRows.length + lostN) ? Math.round(wonRows.length / (wonRows.length + lostN) * 100) : null;
    const avgJob   = wonRows.filter(val).length ? wonVal / wonRows.filter(val).length : 0;

    const leadsThis = rows.filter(r => (r.created_at || '').slice(0,7) === thisMonth).length;
    const leadsLast = rows.filter(r => (r.created_at || '').slice(0,7) === lastMonth).length;
    const delta = leadsLast ? Math.round((leadsThis - leadsLast) / leadsLast * 100) : null;

    // ── Monthly series (last 6 months) ──
    const months = [];
    for (let i = 5; i >= 0; i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      months.push({ key: monthKey(d), lab: d.toLocaleDateString('en-GB', { month:'short' }) });
    }
    const leadsBy = Object.fromEntries(months.map(m => [m.key, 0]));
    const revBy   = Object.fromEntries(months.map(m => [m.key, 0]));
    rows.forEach(r => {
      const ck = (r.created_at || '').slice(0,7);
      if (ck in leadsBy) leadsBy[ck]++;
      if (st(r) === 'won'){
        const wk = (r.move_date || r.created_at || '').slice(0,7);
        if (wk in revBy) revBy[wk] += val(r);
      }
    });

    // ── Status breakdown ──
    const counts = {};
    rows.forEach(r => { counts[st(r)] = (counts[st(r)] || 0) + 1; });
    const maxCount = Math.max(1, ...Object.values(counts));

    // ── Upcoming moves / follow-ups ──
    const upcoming = booked
      .filter(r => (r.move_date || '') >= todayKey)
      .sort((a,b) => (a.move_date || '').localeCompare(b.move_date || ''))
      .slice(0, 6);
    const followups = rows.filter(r => st(r) === 'quote_sent')
      .sort((a,b) => (a.created_at || '').localeCompare(b.created_at || ''))
      .slice(0, 6);

    $('content').innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="l">Pipeline value</div><div class="n">${money(pipelineVal)}</div><div class="s">${pipelineN} open lead${pipelineN===1?'':'s'} (not yet booked)</div></div>
        <div class="kpi"><div class="l">Booked moves</div><div class="n">${money(bookedVal)}</div><div class="s">${booked.length} move${booked.length===1?'':'s'} in the diary</div></div>
        <div class="kpi"><div class="l">Completed revenue</div><div class="n">${money(wonVal)}</div><div class="s">${money(wonThisMonth)} this month</div></div>
        <div class="kpi"><div class="l">Win rate</div><div class="n">${winRate === null ? '—' : winRate + '%'}</div><div class="s">${wonRows.length} won &bull; ${lostN} lost &bull; avg job ${money(avgJob)}</div></div>
        <div class="kpi"><div class="l">New leads this month</div><div class="n">${leadsThis}</div><div class="s">${delta === null ? (leadsLast === 0 && leadsThis > 0 ? 'first month with leads' : 'vs ' + leadsLast + ' last month') : (delta >= 0 ? '<span class="up">&#9650; ' + delta + '%</span>' : '<span class="down">&#9660; ' + Math.abs(delta) + '%</span>') + ' vs ' + leadsLast + ' last month'}</div></div>
      </div>

      <div class="grid">
        <div class="card">
          <h2>New leads per month</h2>
          <p class="sub">Enquiries received, last 6 months</p>
          ${barChart(months.map(m => ({ lab: m.lab, v: leadsBy[m.key] })), false)}
        </div>
        <div class="card">
          <h2>Completed revenue per month</h2>
          <p class="sub">Value of completed moves, last 6 months</p>
          ${barChart(months.map(m => ({ lab: m.lab, v: revBy[m.key] })), true)}
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <h2>Pipeline breakdown</h2>
          <p class="sub">Where every lead sits right now</p>
          ${ORDER.filter(s => counts[s]).map(s => `
            <div class="srow">
              <span class="pill ${s}">${labelFor(s)}</span>
              <div class="track"><div class="fill" style="width:${Math.round(counts[s]/maxCount*100)}%;background:${FILLS[s]}"></div></div>
              <span class="cnt"><strong>${counts[s]}</strong> lead${counts[s]===1?'':'s'}</span>
            </div>`).join('') || '<p class="empty">No leads yet.</p>'}
        </div>
        <div>
          <div class="card">
            <h2>Upcoming moves</h2>
            <p class="sub">Next booked jobs, soonest first</p>
            <ul class="list">
              ${upcoming.map(r => `
                <li>
                  <span class="when">${fmtDay(new Date(r.move_date + 'T00:00:00'))}</span>
                  <span class="who"><a href="/admin/quote/${esc(r.id)}">${esc(r.name || 'Unnamed')}</a><span class="sub">${esc(r.from_postcode || '')} &rarr; ${esc(r.to_postcode || '')}</span></span>
                  <span class="amt">${val(r) ? money(val(r)) : ''}</span>
                </li>`).join('') || '<li class="empty">No moves booked ahead.</li>'}
            </ul>
          </div>
          <div class="card">
            <h2>Quotes awaiting follow-up</h2>
            <p class="sub">Sent but not yet won — oldest first</p>
            <ul class="list">
              ${followups.map(r => {
                const days = r.created_at ? Math.floor((now - new Date(r.created_at)) / 86400000) : null;
                return `
                <li>
                  <span class="who"><a href="/admin/quote/${esc(r.id)}">${esc(r.name || 'Unnamed')}</a><span class="sub">${val(r) ? money(val(r)) + ' quoted' : 'no value set'}</span></span>
                  <span class="days ${days !== null && days > 7 ? 'overdue' : ''}">${days === null ? '' : days + ' day' + (days===1?'':'s') + ' ago'}</span>
                </li>`; }).join('') || '<li class="empty">Nothing waiting — all quotes actioned.</li>'}
            </ul>
          </div>
        </div>
      </div>`;
  }

  // Single-series column chart. Values show on hover; the peak and the latest
  // month are labeled permanently so the chart reads without interaction.
  function barChart(data, isMoney){
    const max = Math.max(1, ...data.map(d => d.v));
    const peak = data.reduce((bi, d, i, a) => d.v > a[bi].v ? i : bi, 0);
    return '<div class="chart">' + data.map((d, i) => {
      const h = Math.round(d.v / max * 100);
      const label = isMoney ? money(d.v) : String(d.v);
      const always = (i === peak && d.v > 0) || i === data.length - 1;
      return `<div class="col" title="${d.lab}: ${label}">
        <span class="val ${always ? 'show' : ''}">${label}</span>
        <div class="bar ${isMoney ? 'accent' : ''}" style="height:${Math.max(2, h)}%"></div>
        <span class="lab">${d.lab}</span>
      </div>`;
    }).join('') + '</div>';
  }

  load();
</script>
</body>
</html>
