<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="/images/admin-touch-icon.png">
<link rel="manifest" href="/admin/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="MKR Admin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D1F3C">
<meta name="robots" content="noindex, nofollow">
<title>Recently Deleted — Admin — Medway &amp; Kent Removals</title>
<style>
  :root{ --navy:#0d1f3c; --orange:#e04e1b; --bg:#f4f5f7; --line:#e3e6ec; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; background:var(--bg); color:#1a2233; }
  .topbar{ background:var(--navy); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:14px; }
  .topbar .brand{ font-weight:700; }
  .topbar .crumb{ color:#ff9a75; font-size:14px; }
  .topbar .spacer{ flex:1; }
  .topbar a{ color:#cfd6e4; text-decoration:none; font-size:14px; }
  .wrap{ max-width:900px; margin:0 auto; padding:24px; }
  .intro{ font-size:13.5px; color:#667; margin:0 0 18px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 20px; }
  .row{ display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .row:last-child{ border-bottom:none; }
  .row .who{ flex:1; min-width:180px; }
  .row .who strong{ display:block; font-size:15px; color:var(--navy); }
  .row .who span{ font-size:12.5px; color:#889; }
  .row .when{ font-size:12.5px; color:#889; min-width:150px; }
  .btn{ padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:13.5px; font-weight:600; }
  .btn.green{ background:#16a34a; color:#fff; border-color:#16a34a; }
  .btn.red{ background:#fff; color:#b91c1c; border-color:#f3c0c0; }
  .empty{ color:#889; font-size:14px; padding:26px 0; text-align:center; }
  .flash{ font-size:13px; font-weight:600; margin:12px 0 0; min-height:18px; }
  .flash.ok{ color:#15803d; } .flash.err{ color:var(--orange); }
  .muted{ color:#99a; font-size:13px; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">Medway &amp; Kent Removals</span>
    <span class="crumb">Admin / Recently Deleted</span>
    <span class="spacer"></span>
    <a href="/admin/dashboard">&larr; Leads</a>
  </div>

  <div class="wrap">
    <p class="intro">Deleted leads rest here for 30 days before being removed for good. Restore puts a lead straight back at the stage it was deleted from. Only you can see this page.</p>
    <div class="card" id="list"><p class="empty">Loading&hellip;</p></div>
    <p class="flash" id="flash"></p>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function flash(msg, ok){ const el = $('flash'); el.textContent = msg; el.className = 'flash ' + (ok ? 'ok' : 'err'); }
  function fmtDT(v){ if(!v) return ''; try{ return new Date(v).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }catch{ return v; } }

  async function api(url, opts){
    const r = await fetch(url, opts);
    if (r.status === 401){ window.location.href = '/admin'; throw new Error('unauth'); }
    return r;
  }

  let ROWS = [];

  async function load(){
    try {
      const r = await api('/api/admin/quotes?status=deleted');
      const data = await r.json();
      if (data.role === 'staff'){ window.location.href = '/admin/dashboard'; return; }
      ROWS = data.quotes || [];
      render();
    } catch(e){
      if (String(e.message) !== 'unauth') $('list').innerHTML = '<p class="empty">Could not load.</p>';
    }
  }

  function daysLeft(r){
    const del = new Date(r.updated_at || r.created_at || Date.now());
    return Math.max(0, 30 - Math.floor((Date.now() - del) / 86400000));
  }

  function render(){
    if (!ROWS.length){ $('list').innerHTML = '<p class="empty">The recycle bin is empty.</p>'; return; }
    $('list').innerHTML = ROWS.map((r) => `
      <div class="row" data-id="${esc(r.id)}">
        <div class="who">
          <strong>${esc(r.name || 'Unnamed')}</strong>
          <span>${esc(r.phone || '')}${r.email ? ' &bull; ' + esc(r.email) : ''}</span>
        </div>
        <span class="when">deleted ${fmtDT(r.updated_at)} &bull; ${daysLeft(r)} day${daysLeft(r)===1?'':'s'} left</span>
        <button class="btn green" data-act="restore">Restore</button>
        <button class="btn red" data-act="forever">Delete forever</button>
      </div>`).join('');

    $('list').querySelectorAll('button').forEach((b) => {
      b.addEventListener('click', async () => {
        const id = b.closest('.row').dataset.id;
        const row = ROWS.find((x) => String(x.id) === String(id));
        const nm = (row && row.name) || 'this lead';
        if (b.dataset.act === 'restore'){
          b.disabled = true;
          const r = await api('/api/admin/quote/' + id, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ restore: true }) });
          if (r.ok){ flash('Restored ' + nm + '.', true); load(); }
          else { flash('Could not restore.', false); b.disabled = false; }
        } else {
          if (!confirm('Permanently delete ' + nm + '? This cannot be undone.')) return;
          b.disabled = true;
          const r = await api('/api/admin/quote/' + id + '?permanent=1', { method:'DELETE' });
          if (r.ok){ flash('Deleted forever.', true); load(); }
          else { flash('Could not delete.', false); b.disabled = false; }
        }
      });
    });
  }

  load();
</script>
</body>
</html>
