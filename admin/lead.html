<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="/images/admin-touch-icon.png">
<link rel="manifest" href="/admin/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="MKR Admin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D1F3C">
<meta name="robots" content="noindex, nofollow">
<title>Lead — Admin — Medway &amp; Kent Removals</title>
<style>
  :root{ --navy:#0d1f3c; --orange:#e04e1b; --bg:#f4f5f7; --line:#e3e6ec; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; background:var(--bg); color:#1a2233; }
  .topbar{ background:var(--navy); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:14px; }
  .topbar .brand{ font-weight:700; }
  .topbar a{ color:#cfd6e4; text-decoration:none; font-size:14px; }
  .topbar .spacer{ flex:1; }
  .wrap{ max-width:1100px; margin:0 auto; padding:24px; }
  .back{ display:inline-block; margin-bottom:16px; color:#556; text-decoration:none; font-size:14px; }
  .cols{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:start; }
  @media(max-width:820px){ .cols{ grid-template-columns:1fr; } }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px; margin-bottom:20px; }
  .card h2{ margin:0 0 16px; font-size:17px; color:var(--navy); }
  dl{ margin:0; display:grid; grid-template-columns:130px 1fr; gap:8px 12px; font-size:14px; }
  dt{ color:#778; } dd{ margin:0; font-weight:600; }
  .pill{ display:inline-block; padding:3px 12px; border-radius:20px; font-size:12px; font-weight:700; }
  .pill.new{ background:#e8f0ff; color:#1d4ed8; } .pill.contacted{ background:#fff4e0; color:#b45309; }
  .pill.accepted{ background:#d1fae5; color:#047857; }
  .pill.quote_sent{ background:#e0e7ff; color:#4338ca; }
  .pill.prospecting{ background:#ccfbf1; color:#0f766e; }
  .pill.survey_booked{ background:#ede9fe; color:#6d28d9; } .pill.move_booked{ background:#dcfce7; color:#15803d; }
  .pill.won{ background:#16a34a; color:#fff; } .pill.lost{ background:#fee2e2; color:#b91c1c; }
  .pill.deleted{ background:#f3f4f6; color:#6b7280; }
  /* ── Redesign: lead header, status stepper, action bar ── */
  .lead-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:2px 0 12px; flex-wrap:wrap; }
  .lead-head h1{ font-size:20px; margin:0; }
  .stepper{ display:flex; flex-wrap:wrap; gap:4px; margin:0 0 6px; }
  .step{ flex:1 1 auto; min-width:84px; text-align:center; font-size:12.5px; font-weight:700; padding:9px 6px; background:#fff;
         border:1px solid var(--line); color:#7a8599; cursor:pointer; font-family:inherit; }
  .step:first-child{ border-radius:10px 0 0 10px; } .step:last-child{ border-radius:0 10px 10px 0; }
  .step.done{ background:#eaf6ef; color:#1b7a43; border-color:#bfe5cd; }
  .step.now{ background:#0d1f3c; color:#fff; border-color:#0d1f3c; cursor:default; }
  .steplost{ font-size:12.5px; color:#b3362a; text-decoration:underline; cursor:pointer; background:none; border:none; padding:0;
             margin:0 2px 14px; font-weight:600; font-family:inherit; }
  .steplost:disabled{ text-decoration:none; cursor:default; }
  .actionbar{ display:flex; gap:10px; margin:0 0 6px; flex-wrap:wrap; }
  .abtn{ position:relative; display:inline-block; }
  .menu{ position:absolute; top:calc(100% + 5px); left:0; background:#fff; border:1px solid var(--line); border-radius:12px;
         box-shadow:0 10px 28px rgba(13,31,60,.18); min-width:240px; padding:6px; z-index:30; display:none; }
  .menu.open{ display:block; }
  .menu button{ display:block; width:100%; text-align:left; background:none; border:none; padding:10px 12px; font-size:13.5px;
                font-weight:600; border-radius:8px; cursor:pointer; color:#1a2233; font-family:inherit; }
  .menu button:hover{ background:#f2f5fa; }
  .menu-sep{ border-top:1px solid var(--line); margin:5px 8px; }
  /* ── Email preview modal: read the letter through before it goes ── */
  .lt-overlay{ position:fixed; inset:0; background:rgba(13,31,60,.45); z-index:60; display:none; align-items:flex-start; justify-content:center; padding:24px 14px; overflow:auto; }
  .lt-overlay.open{ display:flex; }
  .lt-box{ background:#fff; border-radius:16px; max-width:620px; width:100%; padding:20px 22px; box-shadow:0 18px 50px rgba(13,31,60,.35); }
  .lt-box h3{ margin:0 0 4px; font-size:16.5px; }
  .lt-box .lt-to{ font-size:13px; color:#5b6880; margin:0 0 10px; }
  .lt-box textarea{ min-height:300px; font-size:14px; line-height:1.55; }
  .lt-box .lt-note{ font-size:12px; color:#7a8599; margin:8px 0 0; }
  @media (prefers-color-scheme: dark){
    .lt-box{ background:#18213a; }
    .lt-box h3{ color:#fff; }
  }
  @media(max-width:560px){
    .step{ border-radius:8px !important; flex:1 1 30%; }
    .actionbar{ gap:8px; }
    .abtn{ width:100%; }
    .abtn > .btn, .actionbar > .btn{ width:100%; }
    .menu{ right:0; min-width:0; }
  }
  label{ display:block; font-size:13px; font-weight:600; margin:14px 0 5px; color:#445; }
  input,select,textarea{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; }
  textarea{ min-height:70px; resize:vertical; }
  /* 3D key-cap buttons: raised face, darker base edge, press to sink */
  .btn{ padding:11px 16px; border-radius:10px; border:1px solid #d5dae3; cursor:pointer; font-size:14px; font-weight:700; color:#33405a;
        background:linear-gradient(180deg,#ffffff,#eef1f5);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 0 #cfd5df, 0 5px 12px rgba(13,31,60,.10);
        transition:transform .06s ease, box-shadow .06s ease, filter .15s ease; }
  .btn:hover{ filter:brightness(1.04); }
  .btn:active{ transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 0 0 #cfd5df, 0 2px 5px rgba(13,31,60,.14); }
  .btn:disabled{ opacity:.55; transform:none; cursor:default; }
  .btn.primary{ background:linear-gradient(180deg,#1c3560,#0d1f3c); color:#fff; border-color:#0a1830;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 2px 0 #060f1f, 0 5px 14px rgba(13,31,60,.35); }
  .btn.orange{ background:linear-gradient(180deg,#f06535,#df4d1a); color:#fff; border-color:#c44417;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 2px 0 #a53a12, 0 5px 14px rgba(224,78,27,.35); }
  .btn.green{ background:linear-gradient(180deg,#20b355,#159a46); color:#fff; border-color:#118a3e;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 2px 0 #0d7a35, 0 5px 14px rgba(22,163,74,.32); }
  .btn.red{ background:linear-gradient(180deg,#ffffff,#fdf1f1); color:#b91c1c; border-color:#f0c4c4;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 0 #ecc9c9, 0 5px 12px rgba(185,28,28,.10); }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .btn-row .btn{ flex:1 1 45%; min-width:130px; }
  .btn-row .btn.full{ flex:1 1 100%; }
  .group-label{ font-size:11px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:#8894ab; margin:22px 0 2px; }
  .inline{ display:flex; gap:8px; align-items:flex-end; }
  .inline > div{ flex:1; }
  .flash{ font-size:13px; font-weight:600; margin:10px 0 0; min-height:18px; }
  .flash.ok{ color:#15803d; } .flash.err{ color:var(--orange); }
  .note{ background:#fafbfc; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:14px; }
  .note .when{ color:#99a; font-size:12px; margin-top:4px; }
  .appt{ border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; }
  .appt .when{ font-weight:700; } .appt .meta{ font-size:13px; color:#667; margin-top:4px; }
  .appt .tag{ font-size:11px; text-transform:uppercase; letter-spacing:.4px; font-weight:700; color:var(--orange); }
  hr{ border:none; border-top:1px solid var(--line); margin:18px 0; }
  .muted{ color:#99a; font-size:13px; }
  .divider-btn{ display:block; width:100%; margin-top:8px; }
  body.staff .staff-hide{ display:none !important; }
  .skel{ height:44px; border-radius:10px; background:linear-gradient(90deg,#eef0f4 25%,#f7f8fa 50%,#eef0f4 75%); background-size:200% 100%; animation:shimmer 1.1s infinite; margin:10px 0; }
  @keyframes shimmer{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
  .dupe-banner{ background:#fef3c7; border:1px solid #f5d879; border-radius:12px; padding:13px 18px; margin-bottom:16px; font-size:13.5px; color:#92400e; box-shadow:0 2px 0 #ecd98a, 0 5px 12px rgba(180,120,0,.12); }
  .dupe-banner a{ color:#92400e; font-weight:700; }
  .cost-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .cost-row .cost-label{ flex:2; }
  .cost-row .cost-amt{ flex:1; }
  .cost-del{ background:none; border:none; color:#b91c1c; font-size:20px; cursor:pointer; padding:0 6px; line-height:1; }
  .cost-summary{ margin-top:12px; border-radius:10px; padding:13px 16px; font-size:13.5px; font-weight:600; }
  .cost-summary .bar{ height:10px; border-radius:6px; background:#eceef2; margin-top:8px; overflow:hidden; box-shadow:inset 0 2px 4px rgba(13,31,60,.12); }
  .cost-summary .fill{ height:100%; border-radius:6px; box-shadow:inset 0 1px 0 rgba(255,255,255,.35); }
  .cost-summary.good{ background:#ecfdf5; color:#166534; }
  .cost-summary.warn{ background:#fef9c3; color:#854d0e; }
  .cost-summary.bad{ background:#fee2e2; color:#991b1b; }
  .crew-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; transition:background .15s, border-color .15s; }
  .crew-row.on{ background:#ecfdf5; border-color:#86efac; }
  .crew-row label{ display:flex; align-items:center; gap:9px; margin:0; font-size:14.5px; cursor:pointer; color:#1a2233; }
  .crew-row input[type=checkbox]{ width:17px; height:17px; accent-color:#16a34a; cursor:pointer; }
  .crew-wa{ background:#1EBE57; color:#fff; font-size:12px; font-weight:700; padding:6px 12px; border-radius:14px; text-decoration:none; white-space:nowrap;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 2px 0 #128a3e, 0 3px 8px rgba(30,190,87,.3); }
  .crew-pick{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 6px; }
  .crew-pick label{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:14px; padding:5px 11px; font-size:13px; cursor:pointer; margin:0; color:#1a2233; transition:background .15s, border-color .15s; }
  .crew-pick label.on{ background:#ecfdf5; border-color:#86efac; }
  .crew-pick input[type=checkbox]{ width:15px; height:15px; accent-color:#16a34a; cursor:pointer; margin:0; }
  .crew-pick select{ width:auto; font-size:12px; font-weight:600; padding:2px 4px; border:1px solid var(--line); border-radius:8px; background:#fff; margin:0; }
  .appt-wa{ background:#1EBE57; color:#fff; font-size:12px; font-weight:700; padding:6px 12px; border-radius:14px; text-decoration:none; white-space:nowrap; display:inline-block; margin:4px 6px 0 0;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 2px 0 #128a3e, 0 3px 8px rgba(30,190,87,.3); }

  /* ── Dark mode: follows the phone/computer setting ── */
  @media (prefers-color-scheme: dark){
    body{ background:#0e1422; color:#dfe5f0; }
    .topbar{ background:#0a1020; }
    .card{ background:#18213a; border-color:#293651; box-shadow:0 2px 0 #0a101e, 0 8px 22px rgba(0,0,0,.35); }
    input, select, textarea{ background:#121a2e; border-color:#2c3a58; color:#dfe5f0; }
    input::placeholder, textarea::placeholder{ color:#7c89a5; }
    .skel{ background:linear-gradient(90deg,#1a2337 25%,#232e48 50%,#1a2337 75%); background-size:200% 100%; }
    .muted, .empty{ color:#8a97b2; }
  }

  @media (prefers-color-scheme: dark){
    .card h2{ color:#fff; }
    dt{ color:#8a97b2; } dd{ color:#dfe5f0; }
    dd a{ color:#9db4e8; }
    label{ color:#aab6cf; }
    .back, .muted{ color:#8a97b2; }
    .note{ background:#131b30; border-color:#293651; }
    .note .when{ color:#7c89a5; }
    .appt{ border-color:#293651; }
    .appt .meta{ color:#8a97b2; }
    hr{ border-top-color:#293651; }
    .btn{ background:linear-gradient(180deg,#243050,#1a2440); border-color:#2c3a58; color:#dfe5f0;
          box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 2px 0 #0c1322, 0 5px 12px rgba(0,0,0,.35); }
    .crew-row{ border-color:#293651; }
    .crew-row label{ color:#dfe5f0; }
    .crew-row.on{ background:#0e2b1e; border-color:#1f6b45; }
    .crew-pick label{ border-color:#293651; color:#dfe5f0; }
    .crew-pick label.on{ background:#0e2b1e; border-color:#1f6b45; }
    .crew-pick select{ background:#121a2e; border-color:#2c3a58; color:#dfe5f0; }
    .group-label{ color:#7c89a5; }
    .lead-head h1{ color:#fff; }
    .step{ background:#121a2e; border-color:#2c3a58; color:#8a97b2; }
    .step.done{ background:#0e2b1e; border-color:#1f6b45; color:#5ad08a; }
    .step.now{ background:#30425f; border-color:#30425f; color:#fff; }
    .menu{ background:#18213a; border-color:#293651; box-shadow:0 10px 28px rgba(0,0,0,.5); }
    .menu button{ color:#dfe5f0; }
    .menu button:hover{ background:#121a2e; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">Medway &amp; Kent Removals</span>
    <span class="spacer"></span>
    <a href="/admin/dashboard">← All quotes</a>
  </div>

  <div class="wrap">
    <a class="back" href="/admin/dashboard">← Back to dashboard</a>
    <div id="content"><div class="skel"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:85%"></div></div>

    <!-- Follow-up email preview: nothing sends until "Send email" here -->
    <div class="lt-overlay" id="lt-overlay">
      <div class="lt-box">
        <h3 id="lt-title">Email preview</h3>
        <p class="lt-to" id="lt-to"></p>
        <label>Subject</label>
        <input id="lt-subject">
        <label>Email text</label>
        <textarea id="lt-body"></textarea>
        <p class="lt-note">A Call button and a green WhatsApp chat button are added underneath automatically. Edit anything above before sending.</p>
        <div class="btn-row" style="margin-top:12px">
          <button type="button" class="btn green" id="lt-send">Send email</button>
          <button type="button" class="btn" id="lt-cancel">Cancel</button>
        </div>
        <p class="flash" id="lt-flash"></p>
      </div>
    </div>
  </div>

<script>
  // ── Resolve the lead id robustly ──
  // The rewrite /admin/quote/:id -> /admin/lead?id=:id passes it as ?id, but we
  // also read it from the path as a fallback, and strip a stray ".html" that a
  // cleanUrls/catch-all rewrite could leave behind.
  function resolveId(){
    const p = new URLSearchParams(location.search);
    let id = p.get('id');
    if (!id){ const m = location.pathname.match(/\/admin\/quote\/([^/?#]+)/); if (m) id = m[1]; }
    if (id) id = id.replace(/\.html$/, '');
    return id;
  }
  const LEAD_ID = resolveId();

  const $ = (id) => document.getElementById(id);

  // Reusable Monzo deposit link — the same link works for every customer.
  const DEPOSIT_LINK = 'https://monzo.com/pay/r/medway-and-kent-removals_mGjPKnMLgxT2qk';

  // ── Crew roster: name + WhatsApp number (intl format, no spaces) ──
  const CREW = [
    { name: 'Moses',    wa: '447366390504' },
    { name: 'Tibi',     wa: '447340148916' },
    { name: 'Milo',     wa: '447508297584' },
    { name: 'Emmanuel', wa: '447867021205' },
    { name: 'Jackson',  wa: '447383438805' },
    { name: 'Caleb',    wa: '447931926990' },
    { name: 'Mark',     wa: '447344398403' },
    { name: 'Ayanfe',   wa: '447512694962' },
    { name: 'Ejike',    wa: '447831922985' },
    { name: 'Jojo',     wa: '447352763337' },
    { name: 'Francis',  wa: '447400085295' },
    { name: 'Tonna',    wa: '447349864448' },
  ];
  // Crew lives on each booking (appointments.crew). This builds the
  // WhatsApp message for one crew member about one specific booking.
  function crewJobMessage(member, appt, role){
    const q = QUOTE || {};
    const job = appt ? (appt.type === 'survey' ? 'survey' : appt.type === 'packing' ? 'packing day' : 'move') : 'move';
    const bits = ['Hi ' + member + ', you are on the ' + job + (role ? ' as ' + role : '') + ' for ' + (q.name || 'a customer')];
    if (appt && appt.scheduled_for) bits.push('on ' + fmtDT(appt.scheduled_for));
    else if (q.move_date) bits.push('on ' + fmtDate(q.move_date));
    if (q.from_postcode || q.to_postcode) bits.push('from ' + (q.from_postcode || '?') + ' to ' + (q.to_postcode || '?'));
    return bits.join(' ') + '. Please confirm you are available. Thanks, Medway and Kent Removals.';
  }
  // ── Staff identity chip: name + tappable profile photo ──
  // The photo lives in this browser's localStorage; tap the avatar to change it.
  function showStaffChip(name){
    if (document.getElementById('staff-chip')) return;
    var bar = document.querySelector('.topbar');
    if (!bar) return;
    var initials = String(name || '').split(/\s+/).map(function(w){ return w[0] || ''; }).join('').slice(0,2).toUpperCase() || 'S';
    var KEY = 'mkr_staff_avatar_' + String(name || '').replace(/\W+/g, '_').toLowerCase();
    var stored = null;
    try { stored = localStorage.getItem(KEY); } catch(e){}
    var st = document.createElement('style');
    st.textContent = '#staff-chip{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600;font-size:13.5px;}'
      + '#staff-chip .ava{width:30px;height:30px;border-radius:50%;overflow:hidden;background:#e04e1b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;cursor:pointer;border:2px solid rgba(255,255,255,.35);flex:0 0 auto;}'
      + '#staff-chip .ava img{width:100%;height:100%;object-fit:cover;display:block;}'
      + '@media(max-width:520px){#staff-chip .staff-name{display:none;}}';
    document.head.appendChild(st);
    var chip = document.createElement('span');
    chip.id = 'staff-chip';
    chip.innerHTML = '<span class="ava" title="Tap to add or change your photo">'
      + (stored ? '<img src="' + stored + '" alt="">' : initials)
      + '</span><span class="staff-name"></span>';
    chip.querySelector('.staff-name').textContent = name;
    var links = bar.querySelectorAll('a');
    bar.insertBefore(chip, links.length ? links[links.length - 1] : null);
    var input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*'; input.style.display = 'none';
    document.body.appendChild(input);
    chip.querySelector('.ava').addEventListener('click', function(){ input.click(); });
    input.addEventListener('change', function(){
      var f = input.files && input.files[0];
      if (!f) return;
      var img = new Image();
      img.onload = function(){
        var S = 128, c = document.createElement('canvas');
        c.width = S; c.height = S;
        var ctx = c.getContext('2d');
        var side = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - side)/2, (img.height - side)/2, side, side, 0, 0, S, S);
        var data = c.toDataURL('image/jpeg', 0.85);
        try { localStorage.setItem(KEY, data); } catch(e){}
        chip.querySelector('.ava').innerHTML = '<img src="' + data + '" alt="">';
      };
      img.src = URL.createObjectURL(f);
    });
  }

  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const labelFor = (s) => ({ new:'New', accepted:'Accepted', contacted:'Contacted', quote_sent:'Quote Sent', prospecting:'Prospecting', survey_booked:'Survey booked', move_booked:'Move booked', won:'Completed', lost:'Lost', deleted:'In recycle bin' }[s] || s || 'New');

  // ── Status stepper: one strip instead of a wall of buttons ──
  // Clicking a stage patches the status through the same [data-status]
  // handler the old buttons used (incl. the review offer on Completed).
  const STAGES = [
    ['new', 'New'], ['contacted', 'Contacted'], ['prospecting', 'Prospecting'],
    ['quote_sent', 'Quote sent'], ['accepted', 'Accepted'],
    ['survey_booked', 'Survey'], ['move_booked', 'Move booked'], ['won', 'Completed'],
  ];
  function stepperHtml(st){
    const idx = STAGES.findIndex((s) => s[0] === st);
    return '<div class="stepper">' + STAGES.map((s, i) => {
      const cls = s[0] === st ? 'now' : (idx > -1 && i < idx ? 'done' : '');
      return `<button type="button" class="step ${cls}" ${s[0] === st ? 'disabled' : `data-status="${s[0]}"`} title="Move to ${s[1]}">${s[1]}</button>`;
    }).join('') + '</div>'

  function fmtDate(v){ if(!v) return '—'; try{ return new Date(v).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }catch{ return v; } }

  async function api(url, opts){
    const r = await fetch(url, opts);
    if (r.status === 401){ window.location.href = '/admin'; throw new Error('unauth'); }
    return r;

    if (!LEAD_ID){ $('content').innerHTML = '<p class="muted">No lead id supplied.</p>'; return; }

      const r = await api('/api/admin/quote/' + LEAD_ID);
      if (r.status === 404){ $('content').innerHTML = '<p class="muted">Lead not found.</p>'; return; }
      const data = await r.json();
      QUOTE = data.quote; APPTS = data.appointments || []; REMINDERS = data.reminders || []; DUPES = data.duplicates || [];
      if (data.role === 'staff') document.body.classList.add('staff');
      showStaffChip(data.display_name || data.staff_name || 'Admin');
      render();
    } catch (e) {
      if (String(e.message) !== 'unauth') $('content').innerHTML = '<p class="muted">Could not load this lead.</p>';
    }

  // ── Service and property choices for the edit form. A lead whose saved
  //    value is not in the list keeps it as an extra option, so editing
  //    an old lead never silently changes what was recorded. ──
  // Grouped like the Relokates admin: [group label, [[value, shown text]]].
  // Values stay as MKR's existing service names so saved leads and the
  // service-aware quote wording keep matching.
  const SERVICE_GROUPS = [
    ['Residential moves', [
      ['House Removals', 'House Removals'],
      ['Flat Removals', 'Flat Removals (lift, stairs, parking)'],
      ['Man and Van', 'Man and Van (small / short)'],
      ['Single Item Collection', 'Single Item Collection'],
      ['Student Removals', 'Student Removals'],
    ]],
    ['Clearance & disposal', [
      ['House Clearance Service', 'House Clearance (full property)'],
      ['Furniture Disposal', 'Furniture Disposal'],
    ]],
    ['Commercial', [['Office Removals', 'Office Removals']]],
    ['Add-ons', [['Packing Service', 'Packing Services'], ['Storage', 'Secure Storage']]],
    ['Specialist', [
      ['Luxury Removals', 'Luxury Removals'],
      ['Same Day Move', 'Same Day Removals'],
      ['Long Distance Move', 'Long Distance Move'],
    ]],
    ['International', [['International Removal', 'International Removal']]],
    ['Other', [['Other', 'Other']]],
  ];
  const PROPERTY_SIZES = [
    'Single room / single item', 'Studio / 1-bed flat', '2-bed flat', '3-bed flat',
    '2-bed house', '3-bed house', '4-bed house', '5+ bed house',
    'Office', 'Storage unit', 'Other',
  ];
  function serviceOptions(cur){
    const known = new Set(SERVICE_GROUPS.flatMap(([, items]) => items.map(([v]) => v)));
    let html = `<option value="" ${!cur ? 'selected' : ''}>Choose a service</option>`;
    html += SERVICE_GROUPS.map(([lab, items]) =>
      `<optgroup label="${esc(lab)}">`
      + items.map(([v, t]) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(t)}</option>`).join('')
      + '</optgroup>').join('');
    if (cur && !known.has(cur)) html += `<optgroup label="Saved value"><option selected>${esc(cur)}</option></optgroup>`;
    return html;
  }
  function propertyOptions(cur){
    const items = [...PROPERTY_SIZES];
    if (cur && !items.includes(cur)) items.push(cur);
    return `<option value="" ${!cur ? 'selected' : ''}>Choose property type</option>`
      + items.map((v) => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join('');
  }

  // Saved crew entries are {name, role}; older rows may be plain names.
  const ROLES = ['Mover', 'Driver', 'Packer', 'Team leader', 'Foreman', 'Office'];
  const crewEntry = (e) => typeof e === 'string' ? { name: e, role: '' } : { name: (e && e.name) || '', role: (e && e.role) || '' };
  function roleOptions(chosen){
    const list = [...ROLES];
    if (chosen && !list.includes(chosen)) list.push(chosen);
    return list.map((r) => `<option${r === (chosen || 'Mover') ? ' selected' : ''}>${esc(r)}</option>`).join('');
  }

  function renderAppts(){
    if (!APPTS.length) return '<p class="muted">No appointments booked yet.</p>';
    return APPTS.map((a) => {
      const crew = (Array.isArray(a.crew) ? a.crew : []).map(crewEntry).filter((e) => e.name);
      const byName = new Map(crew.map((e) => [e.name, e.role]));
      return `
      <div class="appt" data-appt="${esc(a.id)}">
        <div class="tag">${a.type==='survey'?'Survey':a.type==='packing'?'Packing day':'Moving day'}</div>
        <div class="when">${fmtDT(a.scheduled_for)}</div>
        <div class="meta">${a.duration_minutes||60} mins${a.address?' · '+esc(a.address):''}
          · Calendar: ${a.gcal_event_id?'✓':'—'} · Email: ${a.email_sent?'✓ sent':'not sent'}</div>
        <div class="crew-pick">${CREW.map((c) => {
          const on = byName.has(c.name);
          return `
          <label class="${on ? 'on' : ''}"><input type="checkbox" class="appt-crew-cb" data-appt-id="${esc(a.id)}" data-name="${c.name}" ${on ? 'checked' : ''}> ${c.name}
            <select class="appt-crew-role" data-appt-id="${esc(a.id)}" data-name="${c.name}" aria-label="Role for ${c.name} on this job" ${on ? '' : 'style="display:none"'}>${roleOptions(byName.get(c.name))}</select>
          </label>`; }).join('')}
        </div>
        <div class="btn-row"><button type="button" class="btn appt-crew-save" data-appt-id="${esc(a.id)}" style="display:none;padding:7px 14px">Save crew</button></div>
        ${crew.length ? `<div>${crew.map((e) => {
          const m = CREW.find((c) => c.name === e.name);
          return m ? `<a class="appt-wa" href="https://wa.me/${m.wa}?text=${encodeURIComponent(crewJobMessage(e.name, a, e.role))}" target="_blank" rel="noopener">&#128172; WhatsApp ${esc(e.name)}${e.role ? ' (' + esc(e.role) + ')' : ''}</a>` : '';
        }).join('')}</div>` : ''}
      </div>`; }).join('');
  }

  // Ticking crew on a booking reveals its Save crew button; saving PATCHes
  // the booking, and the WhatsApp links then appear for the saved members.
  function wireApptCrew(){
    document.querySelectorAll('.appt-crew-cb').forEach((cb) => cb.addEventListener('change', () => {
      cb.parentElement.classList.toggle('on', cb.checked);
      const sel = cb.parentElement.querySelector('.appt-crew-role');
      if (sel) sel.style.display = cb.checked ? '' : 'none';
      const btn = document.querySelector('.appt-crew-save[data-appt-id="' + cb.dataset.apptId + '"]');
      if (btn) btn.style.display = '';
    }));
    // Changing a role also counts as an unsaved change.
    document.querySelectorAll('.appt-crew-role').forEach((sel) => sel.addEventListener('change', () => {
      const btn = document.querySelector('.appt-crew-save[data-appt-id="' + sel.dataset.apptId + '"]');
      if (btn) btn.style.display = '';
    }));
    document.querySelectorAll('.appt-crew-save').forEach((btn) => btn.addEventListener('click', async () => {
      const id = btn.dataset.apptId;
      const picked = Array.from(document.querySelectorAll('.appt-crew-cb[data-appt-id="' + id + '"]:checked')).map((c) => ({
        name: c.dataset.name,
        role: (c.parentElement.querySelector('.appt-crew-role') || {}).value || 'Mover',
      }));
      btn.disabled = true;
      try {
        const r = await api('/api/admin/appointment', {
          method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id, crew: picked }),
        });
        if (r.ok){
          const data = await r.json();
          const i = APPTS.findIndex((a) => String(a.id) === String(id));
          if (i > -1 && data.appointment) APPTS[i] = data.appointment;
        }
      } catch {}
      $('appt-list').innerHTML = renderAppts();
      wireApptCrew();
    }));
  }

  function renderReminders(){
    if (!REMINDERS.length) return '<p class="muted">No reminders set.</p>';
    return REMINDERS.map((r) => `
      <div class="appt" data-rem="${esc(r.id)}">
        <div class="when">&#128222; ${fmtDate(r.remind_on)}${r.remind_time ? ' at ' + esc(r.remind_time) : ''}</div>
        <div class="meta">${r.note ? esc(r.note) : 'Call reminder'} &middot; ${r.gcal_event_id ? '&#128197; on calendar' : (r.sent ? '&#9989; emailed' : 'pending')}</div>
        <div class="btn-row"><button class="btn red" data-rem-del="${esc(r.id)}" style="padding:6px 12px">Delete</button></div>
      </div>`).join('');
  }

  function flash(id, msg, ok){ const el = $(id); el.textContent = msg; el.className = 'flash ' + (ok?'ok':'err'); }

  let lastReviewRequest = null;
  async function patchStatus(status, extra){
    const r = await api('/api/admin/quote/' + LEAD_ID, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({ status }, extra || {})),
    });
    if (r.ok){ const d = await r.json(); QUOTE = d.quote; lastReviewRequest = d.review_request || null; }
    return r.ok;
  }

  // ── Distance between the two postcodes: coordinates from postcodes.io,
  //    road distance from the public OSRM router, straight line as fallback. ──
  const DIST_CACHE = {};
  function pcOf(v){
    const m = String(v || '').toUpperCase().match(/([A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2})/);
    return m ? m[1].replace(/\s+/, ' ') : null;
  }
  function routeLink(){
    return 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(QUOTE.from_postcode)
      + '&destination=' + encodeURIComponent(QUOTE.to_postcode) + '&travelmode=driving';
  }
  async function calcDistance(){
    const el = $('lead-distance');
    if (!el || !QUOTE || !QUOTE.from_postcode || !QUOTE.to_postcode) return;
    const route = '<a href="' + routeLink() + '" target="_blank" rel="noopener" style="font-weight:700">Open route &rarr;</a>';
    const a = pcOf(QUOTE.from_postcode), b = pcOf(QUOTE.to_postcode);
    if (!a || !b){ el.innerHTML = 'Add full postcodes to work this out &bull; ' + route; return; }
    const key = a + '|' + b;
    if (DIST_CACHE[key]){ el.innerHTML = DIST_CACHE[key]; return; }
    try {
      const r = await fetch('https://api.postcodes.io/postcodes', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ postcodes: [a, b] }),
      });
      const d = await r.json();
      const p1 = d.result && d.result[0] && d.result[0].result;
      const p2 = d.result && d.result[1] && d.result[1].result;
      if (!p1 || !p2){ el.innerHTML = 'Postcode not recognised &bull; ' + route; return; }
      let html = null;
      try {
        const o = await fetch('https://router.project-osrm.org/route/v1/driving/'
          + p1.longitude + ',' + p1.latitude + ';' + p2.longitude + ',' + p2.latitude + '?overview=false');
        const od = await o.json();
        if (od.routes && od.routes[0]){
          const mi = od.routes[0].distance / 1609.344;
          const mins = Math.round(od.routes[0].duration / 60);
          html = '<strong>' + (mi >= 100 ? Math.round(mi) : mi.toFixed(1)) + ' miles</strong> by road'
            + (mins ? ' &bull; about ' + (mins >= 60 ? Math.floor(mins/60) + ' h ' + (mins%60) + ' min' : mins + ' min') + ' drive' : '')
            + ' &bull; ' + route;
        }
      } catch {}
      if (!html){
        const toR = Math.PI / 180;
        const dLat = (p2.latitude - p1.latitude) * toR, dLon = (p2.longitude - p1.longitude) * toR;
        const h = Math.sin(dLat/2)**2 + Math.cos(p1.latitude*toR) * Math.cos(p2.latitude*toR) * Math.sin(dLon/2)**2;
        const mi = 2 * 3958.8 * Math.asin(Math.sqrt(h));
        html = '<strong>' + mi.toFixed(1) + ' miles</strong> straight line &bull; ' + route;
      }
      DIST_CACHE[key] = html;
      el.innerHTML = html;

        const r = await api('/api/admin/reminder', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ lead_id: LEAD_ID, remind_on, remind_time, note: $('rem-note').value }),
        });
        if (r.ok){
          const d = await r.json();
          REMINDERS.push(d.reminder);
          const warn = (d.errors || []).some((e) => e.step === 'gcal');
          pendingFlash = warn
            ? { id:'flash-rem', msg:'Saved, but couldn’t add to Google Calendar — you’ll get a backup email.', ok:false }
            : { id:'flash-rem', msg:'Reminder added to your calendar for that time.', ok:true };
          render();
        } else {
          const d = await r.json().catch(() => ({}));
          flash('flash-rem', 'Could not set reminder: ' + (d.error || 'error'), false);
        }
      } catch { flash('flash-rem', 'Network error — please try again.', false); }
    });

    document.querySelectorAll('[data-rem-del]').forEach((b) => {
      b.addEventListener('click', async () => {
        const id = b.dataset.remDel;
        if (!confirm('Delete this reminder?')) return;
        try {
          const r = await api('/api/admin/reminder?id=' + encodeURIComponent(id), { method:'DELETE' });
          if (r.ok){ REMINDERS = REMINDERS.filter((x) => String(x.id) !== String(id)); render(); }
        } catch {}
      });
    });
  }

  async function book(type, prefix, newStatus, flashId){
    const date = $(prefix+'-date').value;
    const time = $(prefix+'-time').value;
    if (!date || !time){ flash(flashId, 'Please choose a date and time.', false); return; }
    const scheduled_for = new Date(date + 'T' + time).toISOString();
    const payload = {
      lead_id: LEAD_ID, type, scheduled_for,
      duration_minutes: Number($(prefix+'-dur').value) || 60,
      address: $(prefix+'-addr').value, notes: $(prefix+'-notes').value,
    };
    try {
      const r = await api('/api/admin/appointment', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload),
      });
      const data = await r.json();
      if (r.ok && data.ok){
        if (newStatus) await patchStatus(newStatus);
        if (Array.isArray(data.conflicts) && data.conflicts.length){
          alert('Heads up: you already have ' + data.conflicts.join(', ') + ' booked on that day. The booking is saved, just check your crews.');
        }
        const errs = data.errors || [];
        if (errs.length){
          // Surface the real reason (e.g. the exact Google Calendar / email error).
          const msg = errs.map((e) => e.step + ': ' + (e.message || 'failed')).join(' — ');
          flash(flashId, 'Saved, but ' + msg, false);
          console.warn('Appointment partial failure:', errs);
        } else {
          flash(flashId, 'Booked — calendar event created and email sent.', true);
        }
        await load();
      } else {
        flash(flashId, 'Could not book: ' + (data.error||'error'), false);
      }
    } catch { flash(flashId, 'Network error — please try again.', false); }
  }

  load();
</script>
<script src="/admin/postcode-picker.js" defer></script>
</body>
