<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="/images/admin-touch-icon.png">
<link rel="manifest" href="/admin/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="MKR Admin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D1F3C">
<meta name="robots" content="noindex, nofollow">
<title>Lead — Admin — Medway &amp; Kent Removals</title>
<style>
  :root{ --navy:#0d1f3c; --orange:#e04e1b; --bg:#f4f5f7; --line:#e3e6ec; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; background:var(--bg); color:#1a2233; }
  .topbar{ background:var(--navy); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:14px; }
  .topbar .brand{ font-weight:700; }
  .topbar a{ color:#cfd6e4; text-decoration:none; font-size:14px; }
  .topbar .spacer{ flex:1; }
  .wrap{ max-width:1100px; margin:0 auto; padding:24px; }
  .back{ display:inline-block; margin-bottom:16px; color:#556; text-decoration:none; font-size:14px; }
  .cols{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:start; }
  @media(max-width:820px){ .cols{ grid-template-columns:1fr; } }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px; margin-bottom:20px; }
  .card h2{ margin:0 0 16px; font-size:17px; color:var(--navy); }
  dl{ margin:0; display:grid; grid-template-columns:130px 1fr; gap:8px 12px; font-size:14px; }
  dt{ color:#778; } dd{ margin:0; font-weight:600; }
  .pill{ display:inline-block; padding:3px 12px; border-radius:20px; font-size:12px; font-weight:700; }
  .pill.new{ background:#e8f0ff; color:#1d4ed8; } .pill.contacted{ background:#fff4e0; color:#b45309; }
  .pill.accepted{ background:#d1fae5; color:#047857; }
  .pill.quote_sent{ background:#e0e7ff; color:#4338ca; }
  .pill.prospecting{ background:#ccfbf1; color:#0f766e; }
  .pill.survey_booked{ background:#ede9fe; color:#6d28d9; } .pill.move_booked{ background:#dcfce7; color:#15803d; }
  .pill.won{ background:#16a34a; color:#fff; } .pill.lost{ background:#fee2e2; color:#b91c1c; }
  .pill.deleted{ background:#f3f4f6; color:#6b7280; }
  label{ display:block; font-size:13px; font-weight:600; margin:14px 0 5px; color:#445; }
  input,select,textarea{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; }
  textarea{ min-height:70px; resize:vertical; }
  /* 3D key-cap buttons: raised face, darker base edge, press to sink */
  .btn{ padding:11px 16px; border-radius:10px; border:1px solid #d5dae3; cursor:pointer; font-size:14px; font-weight:700; color:#33405a;
        background:linear-gradient(180deg,#ffffff,#eef1f5);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 0 #cfd5df, 0 5px 12px rgba(13,31,60,.10);
        transition:transform .06s ease, box-shadow .06s ease, filter .15s ease; }
  .btn:hover{ filter:brightness(1.04); }
  .btn:active{ transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 0 0 #cfd5df, 0 2px 5px rgba(13,31,60,.14); }
  .btn:disabled{ opacity:.55; transform:none; cursor:default; }
  .btn.primary{ background:linear-gradient(180deg,#1c3560,#0d1f3c); color:#fff; border-color:#0a1830;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 2px 0 #060f1f, 0 5px 14px rgba(13,31,60,.35); }
  .btn.orange{ background:linear-gradient(180deg,#f06535,#df4d1a); color:#fff; border-color:#c44417;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 2px 0 #a53a12, 0 5px 14px rgba(224,78,27,.35); }
  .btn.green{ background:linear-gradient(180deg,#20b355,#159a46); color:#fff; border-color:#118a3e;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 2px 0 #0d7a35, 0 5px 14px rgba(22,163,74,.32); }
  .btn.red{ background:linear-gradient(180deg,#ffffff,#fdf1f1); color:#b91c1c; border-color:#f0c4c4;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 0 #ecc9c9, 0 5px 12px rgba(185,28,28,.10); }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .btn-row .btn{ flex:1 1 45%; min-width:130px; }
  .btn-row .btn.full{ flex:1 1 100%; }
  .group-label{ font-size:11px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:#8894ab; margin:22px 0 2px; }
  .inline{ display:flex; gap:8px; align-items:flex-end; }
  .inline > div{ flex:1; }
  .flash{ font-size:13px; font-weight:600; margin:10px 0 0; min-height:18px; }
  .flash.ok{ color:#15803d; } .flash.err{ color:var(--orange); }
  .note{ background:#fafbfc; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:14px; }
  .note .when{ color:#99a; font-size:12px; margin-top:4px; }
  .appt{ border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; }
  .appt .when{ font-weight:700; } .appt .meta{ font-size:13px; color:#667; margin-top:4px; }
  .appt .tag{ font-size:11px; text-transform:uppercase; letter-spacing:.4px; font-weight:700; color:var(--orange); }
  hr{ border:none; border-top:1px solid var(--line); margin:18px 0; }
  .muted{ color:#99a; font-size:13px; }
  .divider-btn{ display:block; width:100%; margin-top:8px; }
  body.staff .staff-hide{ display:none !important; }
  .skel{ height:44px; border-radius:10px; background:linear-gradient(90deg,#eef0f4 25%,#f7f8fa 50%,#eef0f4 75%); background-size:200% 100%; animation:shimmer 1.1s infinite; margin:10px 0; }
  @keyframes shimmer{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
  .dupe-banner{ background:#fef3c7; border:1px solid #f5d879; border-radius:12px; padding:13px 18px; margin-bottom:16px; font-size:13.5px; color:#92400e; box-shadow:0 2px 0 #ecd98a, 0 5px 12px rgba(180,120,0,.12); }
  .dupe-banner a{ color:#92400e; font-weight:700; }
  .crew-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; transition:background .15s, border-color .15s; }
  .crew-row.on{ background:#ecfdf5; border-color:#86efac; }
  .crew-row label{ display:flex; align-items:center; gap:9px; margin:0; font-size:14.5px; cursor:pointer; color:#1a2233; }
  .crew-row input[type=checkbox]{ width:17px; height:17px; accent-color:#16a34a; cursor:pointer; }
  .crew-wa{ background:#1EBE57; color:#fff; font-size:12px; font-weight:700; padding:6px 12px; border-radius:14px; text-decoration:none; white-space:nowrap;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 2px 0 #128a3e, 0 3px 8px rgba(30,190,87,.3); }

  /* ── Dark mode: follows the phone/computer setting ── */
  @media (prefers-color-scheme: dark){
    body{ background:#0e1422; color:#dfe5f0; }
    .topbar{ background:#0a1020; }
    .card{ background:#18213a; border-color:#293651; box-shadow:0 2px 0 #0a101e, 0 8px 22px rgba(0,0,0,.35); }
    input, select, textarea{ background:#121a2e; border-color:#2c3a58; color:#dfe5f0; }
    input::placeholder, textarea::placeholder{ color:#7c89a5; }
    .skel{ background:linear-gradient(90deg,#1a2337 25%,#232e48 50%,#1a2337 75%); background-size:200% 100%; }
    .muted, .empty{ color:#8a97b2; }
  }

  @media (prefers-color-scheme: dark){
    .card h2{ color:#fff; }
    dt{ color:#8a97b2; } dd{ color:#dfe5f0; }
    dd a{ color:#9db4e8; }
    label{ color:#aab6cf; }
    .back, .muted{ color:#8a97b2; }
    .note{ background:#131b30; border-color:#293651; }
    .note .when{ color:#7c89a5; }
    .appt{ border-color:#293651; }
    .appt .meta{ color:#8a97b2; }
    hr{ border-top-color:#293651; }
    .btn{ background:linear-gradient(180deg,#243050,#1a2440); border-color:#2c3a58; color:#dfe5f0;
          box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 2px 0 #0c1322, 0 5px 12px rgba(0,0,0,.35); }
    .crew-row{ border-color:#293651; }
    .crew-row label{ color:#dfe5f0; }
    .crew-row.on{ background:#0e2b1e; border-color:#1f6b45; }
    .group-label{ color:#7c89a5; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">Medway &amp; Kent Removals</span>
    <span class="spacer"></span>
    <a href="/admin/dashboard">← All quotes</a>
  </div>

  <div class="wrap">
    <a class="back" href="/admin/dashboard">← Back to dashboard</a>
    <div id="content"><div class="skel"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:85%"></div></div>
  </div>

<script>
  // ── Resolve the lead id robustly ──
  // The rewrite /admin/quote/:id -> /admin/lead?id=:id passes it as ?id, but we
  // also read it from the path as a fallback, and strip a stray ".html" that a
  // cleanUrls/catch-all rewrite could leave behind.
  function resolveId(){
    const p = new URLSearchParams(location.search);
    let id = p.get('id');
    if (!id){ const m = location.pathname.match(/\/admin\/quote\/([^/?#]+)/); if (m) id = m[1]; }
    if (id) id = id.replace(/\.html$/, '');
    return id;
  }
  const LEAD_ID = resolveId();

  const $ = (id) => document.getElementById(id);

  // Reusable Monzo deposit link — the same link works for every customer.
  const DEPOSIT_LINK = 'https://monzo.com/pay/r/medway-and-kent-removals_mGjPKnMLgxT2qk';

  // ── Crew roster: name + WhatsApp number (intl format, no spaces) ──
  const CREW = [
    { name: 'Moses',    wa: '447366390504' },
    { name: 'Tibi',     wa: '447340148916' },
    { name: 'Milo',     wa: '447508297584' },
    { name: 'Emmanuel', wa: '447867021205' },
    { name: 'Jackson',  wa: '447383438805' },
    { name: 'Caleb',    wa: '447931926990' },
    { name: 'Mark',     wa: '447344398403' },
  ];
  // The current crew is whatever the latest "Crew assigned:" note says,
  // so assignments live in the lead's own history with no schema change.
  function currentCrew(){
    const notes = (QUOTE && Array.isArray(QUOTE.admin_notes)) ? QUOTE.admin_notes : [];
    for (let i = notes.length - 1; i >= 0; i--){
      const t = String((notes[i] && notes[i].text) || '');
      if (t.startsWith('Crew cleared')) return [];
      const m = t.match(/^Crew assigned: (.+)$/);
      if (m) return m[1].split(',').map((x) => x.trim()).filter(Boolean);
    }
    return [];
  }
  function crewJobMessage(member){
    const q = QUOTE || {};
    const bits = ['Hi ' + member + ', you are on the move for ' + (q.name || 'a customer')];
    if (q.move_date) bits.push('on ' + fmtDate(q.move_date));
    if (q.from_postcode || q.to_postcode) bits.push('from ' + (q.from_postcode || '?') + ' to ' + (q.to_postcode || '?'));
    return bits.join(' ') + '. Please confirm you are available. Thanks, Medway and Kent Removals.';
  }
  // ── Staff identity chip: name + tappable profile photo ──
  // The photo lives in this browser's localStorage; tap the avatar to change it.
  function showStaffChip(name){
    if (document.getElementById('staff-chip')) return;
    var bar = document.querySelector('.topbar');
    if (!bar) return;
    var initials = String(name || '').split(/\s+/).map(function(w){ return w[0] || ''; }).join('').slice(0,2).toUpperCase() || 'S';
    var KEY = 'mkr_staff_avatar_' + String(name || '').replace(/\W+/g, '_').toLowerCase();
    var stored = null;
    try { stored = localStorage.getItem(KEY); } catch(e){}
    var st = document.createElement('style');
    st.textContent = '#staff-chip{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600;font-size:13.5px;}'
      + '#staff-chip .ava{width:30px;height:30px;border-radius:50%;overflow:hidden;background:#e04e1b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;cursor:pointer;border:2px solid rgba(255,255,255,.35);flex:0 0 auto;}'
      + '#staff-chip .ava img{width:100%;height:100%;object-fit:cover;display:block;}'
      + '@media(max-width:520px){#staff-chip .staff-name{display:none;}}';
    document.head.appendChild(st);
    var chip = document.createElement('span');
    chip.id = 'staff-chip';
    chip.innerHTML = '<span class="ava" title="Tap to add or change your photo">'
      + (stored ? '<img src="' + stored + '" alt="">' : initials)
      + '</span><span class="staff-name"></span>';
    chip.querySelector('.staff-name').textContent = name;
    var links = bar.querySelectorAll('a');
    bar.insertBefore(chip, links.length ? links[links.length - 1] : null);
    var input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*'; input.style.display = 'none';
    document.body.appendChild(input);
    chip.querySelector('.ava').addEventListener('click', function(){ input.click(); });
    input.addEventListener('change', function(){
      var f = input.files && input.files[0];
      if (!f) return;
      var img = new Image();
      img.onload = function(){
        var S = 128, c = document.createElement('canvas');
        c.width = S; c.height = S;
        var ctx = c.getContext('2d');
        var side = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - side)/2, (img.height - side)/2, side, side, 0, 0, S, S);
        var data = c.toDataURL('image/jpeg', 0.85);
        try { localStorage.setItem(KEY, data); } catch(e){}
        chip.querySelector('.ava').innerHTML = '<img src="' + data + '" alt="">';
      };
      img.src = URL.createObjectURL(f);
    });
  }

  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const labelFor = (s) => ({ new:'New', accepted:'Accepted', contacted:'Contacted', quote_sent:'Quote Sent', prospecting:'Prospecting', survey_booked:'Survey booked', move_booked:'Move booked', won:'Completed', lost:'Lost', deleted:'In recycle bin' }[s] || s || 'New');
  function fmtDate(v){ if(!v) return '—'; try{ return new Date(v).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }catch{ return v; } }
  function fmtDT(v){ if(!v) return '—'; try{ return new Date(v).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }catch{ return v; } }

  async function api(url, opts){
    const r = await fetch(url, opts);
    if (r.status === 401){ window.location.href = '/admin'; throw new Error('unauth'); }
    return r;
  }

  let QUOTE = null, APPTS = [], REMINDERS = [], DUPES = [], pendingFlash = null;

  async function load(){
    if (!LEAD_ID){ $('content').innerHTML = '<p class="muted">No lead id supplied.</p>'; return; }
    try {
      const r = await api('/api/admin/quote/' + LEAD_ID);
      if (r.status === 404){ $('content').innerHTML = '<p class="muted">Lead not found.</p>'; return; }
      const data = await r.json();
      QUOTE = data.quote; APPTS = data.appointments || []; REMINDERS = data.reminders || []; DUPES = data.duplicates || [];
      if (data.role === 'staff') document.body.classList.add('staff');
      showStaffChip(data.display_name || data.staff_name || 'Admin');
      render();
    } catch (e) {
      if (String(e.message) !== 'unauth') $('content').innerHTML = '<p class="muted">Could not load this lead.</p>';
    }
  }

  function render(){
    const q = QUOTE, st = q.status || 'new';
    const notes = Array.isArray(q.admin_notes) ? q.admin_notes : [];

    const dupes = DUPES.filter((d) => d.status !== 'deleted');
    const waPhone = String(q.phone || '').replace(/[^\d]/g, '').replace(/^0/, '44');
    $('content').innerHTML = `
    ${dupes.length ? `<div class="dupe-banner">&#9888;&#65039; Possible duplicate — this customer also exists as ${dupes.map((d) => `<a href="/admin/quote/${esc(d.id)}">${esc(d.name || 'Unnamed')} (${labelFor(d.status)})</a>`).join(', ')}. Check before calling twice.</div>` : ''}
    <div class="cols">
      <!-- LEFT -->
      <div>
        <div class="card">
          <h2>Customer details
            <span class="pill ${st}" style="margin-left:8px">${labelFor(st)}</span>
            <button class="btn" id="edit-toggle" style="float:right;padding:6px 12px">Edit</button>
          </h2>

          <!-- View mode -->
          <div id="details-view">
            <dl>
              <dt>Name</dt><dd>${esc(q.name||'—')}</dd>
              <dt>Phone</dt><dd>${q.phone?`<a href="tel:${esc(q.phone)}">${esc(q.phone)}</a> &nbsp;<a href="https://wa.me/${waPhone}?text=${encodeURIComponent('Hi ' + (q.name||'').split(' ')[0] + ', it\'s Medway & Kent Removals about your removals quote.')}" target="_blank" rel="noopener" style="background:#1EBE57;color:#fff;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:12px;text-decoration:none">WhatsApp</a>`:'—'}</dd>
              <dt>Email</dt><dd>${q.email?`<a href="mailto:${esc(q.email)}">${esc(q.email)}</a>`:'—'}</dd>
              <dt>Service</dt><dd>${esc(q.service||'—')}</dd>
              <dt>Moving from</dt><dd>${esc(q.from_postcode||'—')}</dd>
              <dt>Moving to</dt><dd>${esc(q.to_postcode||'—')}</dd>
              <dt>Address</dt><dd>${esc(q.address||'—')}</dd>
              <dt>Property</dt><dd>${esc(q.property_size||'—')}</dd>
              <dt>Move date</dt><dd>${fmtDate(q.move_date)}</dd>
              <dt>Customer notes</dt><dd>${esc(q.notes||'—')}</dd>
              <dt>Received</dt><dd>${fmtDate(q.created_at)}</dd>
            </dl>
          </div>

          <!-- Edit mode -->
          <form id="details-edit" style="display:none">
            <div class="inline">
              <div><label>Name</label><input id="e-name" value="${esc(q.name||'')}"></div>
              <div><label>Phone</label><input id="e-phone" value="${esc(q.phone||'')}"></div>
            </div>
            <label>Email</label><input id="e-email" type="email" value="${esc(q.email||'')}">
            <label>Service</label><input id="e-service" value="${esc(q.service||'')}">
            <div class="inline">
              <div><label>Moving from</label><input id="e-from" value="${esc(q.from_postcode||'')}"></div>
              <div><label>Moving to</label><input id="e-to" value="${esc(q.to_postcode||'')}"></div>
            </div>
            <div class="inline">
              <div><label>Property</label><input id="e-property" value="${esc(q.property_size||'')}"></div>
              <div><label>Move date</label><input id="e-date" type="date" value="${esc((q.move_date||'').slice(0,10))}"></div>
            </div>
            <label>Full address</label><textarea id="e-address">${esc(q.address||'')}</textarea>
            <label>Customer notes</label><textarea id="e-notes">${esc(q.notes||'')}</textarea>
            <div class="btn-row">
              <button type="submit" class="btn primary">Save changes</button>
              <button type="button" class="btn" id="edit-cancel">Cancel</button>
            </div>
          </form>

          <hr class="staff-hide">
          <div class="staff-hide">
          <label>Job value (£)</label>
          <div class="inline">
            <div><input type="number" id="value" step="0.01" value="${q.value ?? ''}" placeholder="0.00"></div>
            <button class="btn" id="save-value">Save</button>
          </div>

          <div class="group-label">Documents</div>
          <div class="btn-row">
            <button class="btn orange full" id="gen-quote">&#128196; Generate quote document</button>
            <button class="btn" id="gen-invoice">&#129534; Invoice</button>
            <button class="btn" id="gen-receipt" style="color:#15803d">&#129534; Receipt</button>
          </div>
          </div>

          <div class="group-label">Status</div>
          <div class="btn-row">
            <button class="btn primary" data-status="contacted">Contacted</button>
            <button class="btn" data-status="quote_sent" style="color:#4338ca">Quote sent</button>
            <button class="btn" data-status="accepted" style="color:#047857">Accepted</button>
            <button class="btn" data-status="prospecting" style="color:#0f766e">Prospecting</button>
            <button class="btn green" data-status="won">Completed</button>
            <button class="btn red full" data-status="lost">Mark lost</button>
          </div>
          <div class="group-label">Customer messages</div>
          <div class="btn-row">
            <button class="btn green full" id="send-deposit">&#128183; WhatsApp the &pound;50 deposit link</button>
            <button class="btn" id="send-followup" style="color:#4338ca">&#9203; Quote follow-up</button>
            <button class="btn" id="send-review" style="color:#92400e">&#11088; Review request</button>
            <button class="btn full" id="review-received" style="color:#15803d">&#10003; Mark review received</button>
          </div>
          <p class="flash" id="flash-left"></p>

          <hr>
          <button class="btn red divider-btn staff-hide" id="delete-lead">Delete this quote</button>
        </div>

        <div class="card">
          <h2>Internal notes</h2>
          <div id="notes-list">${
            notes.length ? notes.map((n) => `<div class="note">${esc(n.text)}<div class="when">${fmtDT(n.at)}</div></div>`).join('')
                         : '<p class="muted">No notes yet.</p>'
          }</div>
          <textarea id="note-text" placeholder="Add an internal note…"></textarea>
          <div class="btn-row"><button class="btn" id="add-note">Add note</button></div>
          <p class="flash" id="flash-note"></p>
        </div>

        <div class="card">
          <h2>Appointments &amp; bookings</h2>
          <div id="appt-list">${renderAppts()}</div>
        </div>
      </div>

      <!-- RIGHT -->
      <div>
        <div class="card">
          <h2>Crew for this job</h2>
          <div id="crew-list">${CREW.map((c) => {
            const on = currentCrew().includes(c.name);
            return `
            <div class="crew-row ${on ? 'on' : ''}" data-name="${c.name}">
              <label><input type="checkbox" class="crew-cb" data-name="${c.name}" ${on ? 'checked' : ''}> <strong>${c.name}</strong></label>
              <a class="crew-wa" href="https://wa.me/${c.wa}?text=${encodeURIComponent(crewJobMessage(c.name))}" target="_blank" rel="noopener">&#128172; WhatsApp</a>
            </div>`; }).join('')}
          </div>
          <div class="btn-row"><button class="btn primary" id="save-crew">Save crew</button></div>
          <p class="flash" id="flash-crew"></p>
        </div>
        <div class="card">
          <h2>Book a survey</h2>
          <div class="inline">
            <div><label>Date</label><input type="date" id="sv-date"></div>
            <div><label>Time</label><input type="time" id="sv-time" value="10:00"></div>
          </div>
          <label>Duration (mins)</label><input type="number" id="sv-dur" value="45">
          <label>Address</label><input id="sv-addr" value="${esc(q.from_postcode||'')}">
          <label>Notes</label><textarea id="sv-notes"></textarea>
          <div class="btn-row"><button class="btn orange" id="book-survey">Book survey</button></div>
          <p class="flash" id="flash-survey"></p>
        </div>

        <div class="card">
          <h2>Book the moving date</h2>
          <div class="inline">
            <div><label>Date</label><input type="date" id="mv-date" value="${q.move_date||''}"></div>
            <div><label>Time</label><input type="time" id="mv-time" value="08:00"></div>
          </div>
          <label>Duration (mins)</label><input type="number" id="mv-dur" value="240">
          <label>Address</label><input id="mv-addr" value="${esc(q.from_postcode||'')}">
          <label>Notes</label><textarea id="mv-notes"></textarea>
          <div class="btn-row"><button class="btn orange" id="book-move">Book move</button></div>
          <p class="flash" id="flash-move"></p>
        </div>

        <div class="card">
          <h2>Call reminders</h2>
          <div id="rem-list">${renderReminders()}</div>
          <div class="inline">
            <div><label>Date</label><input type="date" id="rem-date"></div>
            <div><label>Time</label><input type="time" id="rem-time" value="09:30"></div>
          </div>
          <label>Note (optional)</label>
          <input id="rem-note" placeholder="e.g. Follow up after survey">
          <div class="btn-row"><button class="btn orange" id="set-reminder">Set reminder</button></div>
          <p class="flash" id="flash-rem"></p>
          <p class="muted" style="font-size:12px;margin-top:8px">Adds a “Call” event to Google Calendar and alerts you at that time.</p>
        </div>
      </div>
    </div>`;

    wire();
    if (pendingFlash){ flash(pendingFlash.id, pendingFlash.msg, pendingFlash.ok); pendingFlash = null; }
  }

  function renderAppts(){
    if (!APPTS.length) return '<p class="muted">No appointments booked yet.</p>';
    return APPTS.map((a) => `
      <div class="appt" data-appt="${esc(a.id)}">
        <div class="tag">${a.type==='survey'?'Survey':'Moving day'}</div>
        <div class="when">${fmtDT(a.scheduled_for)}</div>
        <div class="meta">${a.duration_minutes||60} mins${a.address?' · '+esc(a.address):''}
          · Calendar: ${a.gcal_event_id?'✓':'—'} · Email: ${a.email_sent?'✓ sent':'not sent'}</div>
      </div>`).join('');
  }

  function renderReminders(){
    if (!REMINDERS.length) return '<p class="muted">No reminders set.</p>';
    return REMINDERS.map((r) => `
      <div class="appt" data-rem="${esc(r.id)}">
        <div class="when">&#128222; ${fmtDate(r.remind_on)}${r.remind_time ? ' at ' + esc(r.remind_time) : ''}</div>
        <div class="meta">${r.note ? esc(r.note) : 'Call reminder'} &middot; ${r.gcal_event_id ? '&#128197; on calendar' : (r.sent ? '&#9989; emailed' : 'pending')}</div>
        <div class="btn-row"><button class="btn red" data-rem-del="${esc(r.id)}" style="padding:6px 12px">Delete</button></div>
      </div>`).join('');
  }

  function flash(id, msg, ok){ const el = $(id); el.textContent = msg; el.className = 'flash ' + (ok?'ok':'err'); }

  let lastReviewRequest = null;
  async function patchStatus(status, extra){
    const r = await api('/api/admin/quote/' + LEAD_ID, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({ status }, extra || {})),
    });
    if (r.ok){ const d = await r.json(); QUOTE = d.quote; lastReviewRequest = d.review_request || null; }
    return r.ok;
  }

  function wire(){
    // ── Edit customer details ──
    $('edit-toggle').addEventListener('click', () => {
      const editing = $('details-edit').style.display !== 'none';
      $('details-edit').style.display = editing ? 'none' : 'block';
      $('details-view').style.display = editing ? 'block' : 'none';
      $('edit-toggle').textContent = editing ? 'Edit' : 'Close';
    });
    $('edit-cancel').addEventListener('click', () => {
      $('details-edit').style.display = 'none';
      $('details-view').style.display = 'block';
      $('edit-toggle').textContent = 'Edit';
    });
    $('details-edit').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        name: $('e-name').value.trim(),
        phone: $('e-phone').value.trim(),
        email: $('e-email').value.trim(),
        service: $('e-service').value.trim(),
        from_postcode: $('e-from').value.trim(),
        to_postcode: $('e-to').value.trim(),
        property_size: $('e-property').value.trim(),
        move_date: $('e-date').value,
        address: $('e-address').value.trim(),
        notes: $('e-notes').value.trim(),
      };
      try {
        const r = await api('/api/admin/quote/' + LEAD_ID, {
          method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload),
        });
        if (r.ok){
          QUOTE = (await r.json()).quote;
          pendingFlash = { id:'flash-left', msg:'Customer details saved.', ok:true };
          render();
        } else {
          const d = await r.json().catch(() => ({}));
          flash('flash-left', 'Could not save: ' + (d.error || 'error'), false);
        }
      } catch { flash('flash-left', 'Network error — please try again.', false); }
    });

    $('save-value').addEventListener('click', async () => {
      try {
        const r = await api('/api/admin/quote/' + LEAD_ID, {
          method:'PATCH', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ value: $('value').value }),
        });
        flash('flash-left', r.ok ? 'Value saved.' : 'Could not save value.', r.ok);
      } catch {}
    });

    $('gen-quote').addEventListener('click', () => {
      window.open('/admin/quote-doc?id=' + encodeURIComponent(LEAD_ID), '_blank');
    });
    $('gen-invoice').addEventListener('click', () => {
      window.open('/admin/invoice-doc?id=' + encodeURIComponent(LEAD_ID) + '&type=invoice', '_blank');
    });
    $('save-crew').addEventListener('click', async () => {
      const picked = Array.from(document.querySelectorAll('.crew-cb:checked')).map((c) => c.dataset.name);
      const text = picked.length ? 'Crew assigned: ' + picked.join(', ') : 'Crew cleared';
      const b = $('save-crew'); b.disabled = true;
      try {
        const r = await api('/api/admin/quote/' + LEAD_ID + '/note', {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text }),
        });
        if (r.ok){ QUOTE = (await r.json()).quote; flash('flash-crew', picked.length ? 'Crew saved: ' + picked.join(', ') + '.' : 'Crew cleared.', true); render(); }
        else flash('flash-crew', 'Could not save crew.', false);
      } catch(e){ if (String(e.message) !== 'unauth') flash('flash-crew', 'Could not save crew.', false); }
      b.disabled = false;
    });
    $('send-deposit').addEventListener('click', async () => {
      if (!QUOTE || !QUOTE.phone){ flash('flash-left', 'No phone number on this lead.', false); return; }
      const waNum = String(QUOTE.phone).replace(/[^\d]/g, '').replace(/^0/, '44');
      const first = (QUOTE.name || 'there').split(' ')[0];
      const msg = 'Hi ' + first + ', thank you for confirming your move with Medway and Kent Removals. '
        + 'To secure your date, please pay your \u00a350 deposit using this secure link: '
        + DEPOSIT_LINK
        + ' \u2014 once it is paid, your date is locked in. Any questions, just reply here. Thanks!';
      window.open('https://wa.me/' + waNum + '?text=' + encodeURIComponent(msg), '_blank');
      // Best-effort history entry; opening WhatsApp is not proof of sending,
      // so the note says opened, not sent.
      try {
        const r = await api('/api/admin/quote/' + LEAD_ID + '/note', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ text: 'Deposit link opened in WhatsApp for ' + QUOTE.phone }),
        });
        if (r.ok){ QUOTE = (await r.json()).quote; render(); }
      } catch {}
    });
    $('send-followup').addEventListener('click', async () => {
      if (!QUOTE || !QUOTE.email){ flash('flash-left', 'No email address on this lead.', false); return; }
      if (!confirm('Email ' + QUOTE.email + ' a gentle follow-up about their quote?')) return;
      const b = $('send-followup'); b.disabled = true;
      try {
        const r = await api('/api/admin/quote/' + LEAD_ID, {
          method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ send_followup: true }),
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.followup === 'sent'){ flash('flash-left', 'Follow-up emailed to ' + QUOTE.email + '.', true); load(); }
        else flash('flash-left', 'Could not send: ' + (d.error || 'error'), false);
      } catch(e){ if (String(e.message) !== 'unauth') flash('flash-left', 'Could not send.', false); }
      b.disabled = false;
    });
    $('send-review').addEventListener('click', async () => {
      if (!QUOTE || !QUOTE.email){ flash('flash-left', 'No email address on this lead.', false); return; }
      if (!confirm('Email ' + QUOTE.email + ' the Google review link?')) return;
      const b = $('send-review'); b.disabled = true;
      try {
        const r = await api('/api/admin/quote/' + LEAD_ID, {
          method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ resend_review: true }),
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.review_request === 'sent'){ flash('flash-left', 'Review request emailed to ' + QUOTE.email + '.', true); load(); }
        else flash('flash-left', 'Could not send: ' + (d.error || 'error'), false);
      } catch(e){ if (String(e.message) !== 'unauth') flash('flash-left', 'Could not send.', false); }
      b.disabled = false;
    });
    $('review-received').addEventListener('click', async () => {
      const b = $('review-received'); b.disabled = true;
      try {
        const r = await api('/api/admin/quote/' + LEAD_ID + '/note', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ text: 'Review received on Google' }),
        });
        if (r.ok){ QUOTE = (await r.json()).quote; flash('flash-left', 'Marked as review received — it will drop off the Insights reminder list.', true); render(); }
        else flash('flash-left', 'Could not save.', false);
      } catch(e){ if (String(e.message) !== 'unauth') flash('flash-left', 'Could not save.', false); }
      b.disabled = false;
    });
    $('gen-receipt').addEventListener('click', () => {
      window.open('/admin/invoice-doc?id=' + encodeURIComponent(LEAD_ID) + '&type=receipt', '_blank');
    });

    document.querySelectorAll('[data-status]').forEach((b) => {
      b.addEventListener('click', async () => {
        // Marking completed offers (but never auto-sends) the review request.
        let extra = null;
        if (b.dataset.status === 'won' && QUOTE && QUOTE.email){
          const alreadyAsked = Array.isArray(QUOTE.admin_notes)
            && QUOTE.admin_notes.some((n) => String(n && n.text).includes('Review request emailed'));
          if (!alreadyAsked){
            extra = { send_review: confirm('Also email ' + QUOTE.email + ' a thank-you with your Google review link?') };
          }
        }
        const ok = await patchStatus(b.dataset.status, extra);
        if (ok){
          let msg = 'Status updated to “'+labelFor(b.dataset.status)+'”.';
          if (lastReviewRequest === 'sent') msg += ' Google review request emailed to the customer.';
          if (lastReviewRequest === 'failed') msg += ' (Review request email could not be sent.)';
          flash('flash-left', msg, true); render();
        }
        else flash('flash-left', 'Could not update status.', false);
      });
    });

    $('delete-lead').addEventListener('click', async () => {
      if (!confirm('Delete this quote permanently?')) return;
      try {
        const r = await api('/api/admin/quote/' + LEAD_ID, { method:'DELETE' });
        if (r.ok) window.location.href = '/admin/dashboard';
      } catch {}
    });

    $('add-note').addEventListener('click', async () => {
      const text = $('note-text').value.trim();
      if (!text) return;
      try {
        const r = await api('/api/admin/quote/' + LEAD_ID + '/note', {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text }),
        });
        if (r.ok){ QUOTE = (await r.json()).quote; render(); }
        else flash('flash-note', 'Could not add note.', false);
      } catch {}
    });

    $('book-survey').addEventListener('click', () => book('survey', 'sv', 'survey_booked', 'flash-survey'));
    $('book-move').addEventListener('click',   () => book('move',   'mv', 'move_booked',   'flash-move'));

    $('set-reminder').addEventListener('click', async () => {
      const remind_on = $('rem-date').value;
      const remind_time = $('rem-time').value || '09:30';
      if (!remind_on){ flash('flash-rem', 'Please pick a date.', false); return; }
      try {
        const r = await api('/api/admin/reminder', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ lead_id: LEAD_ID, remind_on, remind_time, note: $('rem-note').value }),
        });
        if (r.ok){
          const d = await r.json();
          REMINDERS.push(d.reminder);
          const warn = (d.errors || []).some((e) => e.step === 'gcal');
          pendingFlash = warn
            ? { id:'flash-rem', msg:'Saved, but couldn’t add to Google Calendar — you’ll get a backup email.', ok:false }
            : { id:'flash-rem', msg:'Reminder added to your calendar for that time.', ok:true };
          render();
        } else {
          const d = await r.json().catch(() => ({}));
          flash('flash-rem', 'Could not set reminder: ' + (d.error || 'error'), false);
        }
      } catch { flash('flash-rem', 'Network error — please try again.', false); }
    });

    document.querySelectorAll('[data-rem-del]').forEach((b) => {
      b.addEventListener('click', async () => {
        const id = b.dataset.remDel;
        if (!confirm('Delete this reminder?')) return;
        try {
          const r = await api('/api/admin/reminder?id=' + encodeURIComponent(id), { method:'DELETE' });
          if (r.ok){ REMINDERS = REMINDERS.filter((x) => String(x.id) !== String(id)); render(); }
        } catch {}
      });
    });
  }

  async function book(type, prefix, newStatus, flashId){
    const date = $(prefix+'-date').value;
    const time = $(prefix+'-time').value;
    if (!date || !time){ flash(flashId, 'Please choose a date and time.', false); return; }
    const scheduled_for = new Date(date + 'T' + time).toISOString();
    const payload = {
      lead_id: LEAD_ID, type, scheduled_for,
      duration_minutes: Number($(prefix+'-dur').value) || 60,
      address: $(prefix+'-addr').value, notes: $(prefix+'-notes').value,
    };
    try {
      const r = await api('/api/admin/appointment', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload),
      });
      const data = await r.json();
      if (r.ok && data.ok){
        await patchStatus(newStatus);
        if (Array.isArray(data.conflicts) && data.conflicts.length){
          alert('Heads up: you already have ' + data.conflicts.join(', ') + ' booked on that day. The booking is saved, just check your crews.');
        }
        const errs = data.errors || [];
        if (errs.length){
          // Surface the real reason (e.g. the exact Google Calendar / email error).
          const msg = errs.map((e) => e.step + ': ' + (e.message || 'failed')).join(' — ');
          flash(flashId, 'Saved, but ' + msg, false);
          console.warn('Appointment partial failure:', errs);
        } else {
          flash(flashId, 'Booked — calendar event created and email sent.', true);
        }
        await load();
      } else {
        flash(flashId, 'Could not book: ' + (data.error||'error'), false);
      }
    } catch { flash(flashId, 'Network error — please try again.', false); }
  }

  load();
</script>
</body>
</html>
