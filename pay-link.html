<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pay for your move | Medway &amp; Kent Removals</title>
<style>
body{margin:0;font-family:'DM Sans',-apple-system,Arial,sans-serif;background:#f6f0e4;color:#16294a;display:flex;justify-content:center;padding:24px 16px;box-sizing:border-box;min-height:100vh}
.card{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:30px 26px;box-shadow:0 18px 50px rgba(13,31,60,.15);align-self:flex-start}
h1{font-size:23px;margin:0 0 6px}.sub{font-size:14.5px;color:#3a4763;line-height:1.6;margin:0 0 16px}
.sum{background:#f6f0e4;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.7;margin-bottom:16px}
.opt{display:block;border:2px solid #e3dccb;border-radius:12px;padding:13px 14px;margin:0 0 10px;cursor:pointer}
.opt input{margin-right:10px}.opt b{font-size:15.5px}.opt span{display:block;font-size:13px;color:#4a5670;margin:3px 0 0 26px}
.opt.sel{border-color:#c94d1e;background:#fff8f3}
.opt.klarna.sel{border-color:#ff8fb0;background:#fff0f5}
.badge{display:inline-block;background:#ffb3c7;color:#17120f;font-size:11px;font-weight:800;border-radius:5px;padding:2px 7px;margin-left:6px}
button{width:100%;border:0;border-radius:10px;background:#c94d1e;color:#fff;font:700 16px inherit;padding:14px;cursor:pointer;margin-top:6px}
button[disabled]{opacity:.6;cursor:default}
.err{color:#b91c1c;font-size:14px;margin-top:12px;min-height:18px}
.small{font-size:12.5px;color:#6a748a;margin-top:12px;line-height:1.5}
a{color:#c94d1e}
</style>
</head>
<body>
<div class="card" id="card"><p class="sub">Loading your booking&hellip;</p></div>
<script>
(function(){
  var qs=new URLSearchParams(location.search), L=qs.get('l'), T=qs.get('t'), card=document.getElementById('card');
  function gbp(n){return '\u00a3'+Number(n).toLocaleString('en-GB')}
  function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function post(b){return fetch('/api/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})}
  function fail(m){card.innerHTML='<h1>Payment link</h1><p class="sub">'+esc(m)+'</p><p class="sub"><a href="tel:01634971005">Call 01634 971005</a></p>'}
  if(!L||!T){fail('This payment link is not valid. Please call us and we will help.');return}
  post({paylink:1,mode:'info',l:L,t:T}).then(function(x){
    if(!x.ok){fail(x.j.error||'This payment link is not valid any more.');return}
    var d=x.j, mv='';
    if(d.move_date){try{mv=new Date(d.move_date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){}}
    var h='<h1>Hi '+esc(d.first||'there')+', pay for your move</h1><p class="sub">Choose how you would like to pay. It takes a minute and goes through Stripe, our secure payment provider.</p>';
    h+='<div class="sum"><b>Your fixed price: '+gbp(d.total)+'</b><br>'+esc(d.size)+(d.from?' &middot; '+esc(d.from)+' to '+esc(d.to):'')+(mv?'<br>Move date: '+esc(mv):'')+'</div>';
    h+='<label class="opt sel" id="o-deposit"><input type="radio" name="pay" value="deposit" checked><b>Pay a 10% deposit: '+gbp(d.deposit)+'</b><span>Secures your date. The rest is paid to the crew on moving day.</span></label>';
    h+='<label class="opt" id="o-full"><input type="radio" name="pay" value="full"><b>Pay in full by card: '+gbp(d.total)+'</b><span>Nothing to pay on the day.</span></label>';
    if(d.klarnaOk)h+='<label class="opt klarna" id="o-klarna"><input type="radio" name="pay" value="klarna"><b>Pay in full with Klarna<span class="badge">Klarna</span></b><span>Choose Klarna at checkout and see the payment options Klarna offers you. Subject to status.</span></label>';
    h+='<button id="go">Continue to secure payment</button><div class="err" id="err">'+(qs.get('cancelled')?'Payment was cancelled. You can choose again when you are ready.':'')+'</div>';
    h+='<p class="small">Questions? Call <a href="tel:01634971005">01634 971005</a>.</p>';
    card.innerHTML=h;
    var opts=card.querySelectorAll('.opt');
    card.querySelectorAll('input[name=pay]').forEach(function(r){r.addEventListener('change',function(){opts.forEach(function(o){o.classList.toggle('sel',o.querySelector('input').checked)})})});
    document.getElementById('go').addEventListener('click',function(){
      var b=this, pay=card.querySelector('input[name=pay]:checked').value; b.disabled=true; b.textContent='Taking you to secure payment\u2026';
      post({paylink:1,mode:'go',l:L,t:T,pay:pay}).then(function(y){
        if(y.ok&&y.j.url){location.href=y.j.url;return}
        document.getElementById('err').textContent=y.j.error||'Something went wrong. Please call 01634 971005.';b.disabled=false;b.textContent='Continue to secure payment';
      }).catch(function(){document.getElementById('err').textContent='Something went wrong. Please call 01634 971005.';b.disabled=false;b.textContent='Continue to secure payment'});
    });
  }).catch(function(){fail('Something went wrong. Please call 01634 971005.')});
})();
</script>
</body>
</html>
